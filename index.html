<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Huan_Hi_Karaoke 歡喜卡拉OK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="app.css">
  
  <!-- Core Engines -->
  <script src="xmlplay_188/jquery-3.3.1.slim.min.js"></script>
  <script src="xmlplay_188/abc2svg-1.js"></script>
  <script src="xml2abc-js_122/xml2abc.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>歡喜卡拉OK <span>Huan_Hi_Karaoke</span></h1>
    <div style="font-size: 0.85rem; color: var(--text-muted);">
      Powered by Tone.js & abc2svg
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      
      <!-- Song Selection -->
      <div>
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
          示範曲庫
        </div>
        <div class="song-list" id="songList">
          <!-- Populated by JavaScript -->
        </div>
      </div>

      <!-- File Upload -->
      <div>
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          自訂樂譜
        </div>
        <label class="file-dropzone" id="dropzone">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
          <span>拖放 MusicXML / MXL / ABC</span>
          <span style="font-size: 0.7rem; opacity: 0.7;">或點擊此處瀏覽檔案</span>
          <input type="file" id="fileInput" accept=".xml,.mxl,.abc">
        </label>
      </div>

      <!-- Rendering Options -->
      <div class="control-group">
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
          顯示設定
        </div>
        <div class="control-row">
          <span class="control-label">樂譜顯示樣式</span>
          <div class="toggle-container" id="notationToggle">
            <span style="font-size: 0.8rem; margin-right: 0.25rem;">五線譜</span>
            <div class="toggle-switch"></div>
            <span style="font-size: 0.8rem; margin-left: 0.25rem;">簡譜</span>
          </div>
        </div>
      </div>

      <!-- Global Playback Controls -->
      <div class="control-group">
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          播放控制
        </div>
        
        <div class="control-row">
          <span class="control-label">播放速度 (Tempo)</span>
          <span class="control-value" id="tempoVal">1.0x</span>
        </div>
        <input type="range" id="tempoSlider" min="0.5" max="2.0" step="0.1" value="1.0">

        <div class="control-row" style="margin-top: 0.5rem;">
          <span class="control-label">變調 (Key Shift)</span>
          <span class="control-value" id="keyVal">0</span>
        </div>
        <input type="range" id="keySlider" min="-6" max="6" step="1" value="0">
        
        <div class="player-controls">
          <button class="btn btn-play" id="playBtn">播放</button>
          <button class="btn btn-secondary btn-danger" id="stopBtn" style="border-radius: 9999px; display: none;">停止</button>
        </div>
      </div>

      <!-- Track & Instruments Settings -->
      <div class="track-manager" id="trackManager">
        <div class="section-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-8m0 0V4m0 8h8m-8 0H4"></path></svg>
          軌道樂器分配
        </div>
        <div id="trackList" style="display: flex; flex-direction: column; gap: 0.5rem;">
          <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 1rem 0;">
            載入樂譜後即可調整音軌
          </div>
        </div>
      </div>

    </aside>

    <!-- Workspace -->
    <main class="workspace">
      <!-- Score Display -->
      <div class="score-area">
        <div id="notation">
          <!-- SVG sheet music rendered here -->
          <div style="text-align: center; margin-top: 15vh; color: var(--bg-color); opacity: 0.15; font-family: 'Outfit'; font-size: 4rem; font-weight: 800; user-select: none;">
            Huan Hi Karaoke
          </div>
        </div>
      </div>

      <!-- Lyric Synchronizer -->
      <div class="lyric-bar">
        <div class="lyric-line-prev" id="lyricPrev"></div>
        <div class="lyric-line-current" id="lyricCurrent">歡喜就好，唱歌最快樂！</div>
        <div class="lyric-line-next" id="lyricNext"></div>
      </div>

    </main>
  </div>

  <!-- Loading Overlay -->
  <div id="wait">
    <div class="spinner"></div>
    <span id="waitText">載入樂器中，請稍候...</span>
  </div>

  <!-- Hidden elements required by xmlplay_lib.js / xmlplay_syn.js -->
  <input id="tempo" type="hidden" value="1.0">
  <div id="err" style="display:none;white-space:pre;font-size:0.7rem;"></div>
  <div id="comp" class="dlog" style="display:none;"></div>

  <!-- App Javascript -->
  <script src="app.js" type="module"></script>
</body>
</html>
